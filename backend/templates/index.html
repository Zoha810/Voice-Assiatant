<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="flex flex-col w-full max-w-md h-5/6 bg-white rounded-xl shadow-lg overflow-hidden">
    <header class="bg-gradient-to-r from-blue-600 to-indigo-800 p-4 text-center">
      <h1 class="text-white text-2xl font-semibold">Voice Assistant</h1>
    </header>
    <main class="flex-1 p-4 overflow-y-auto space-y-4">
      <div id="chat" class="flex flex-col space-y-3"></div>
    </main>
    <footer class="p-4 bg-gray-50 border-t border-gray-200">
      <form id="text-form" class="flex gap-2">
        <input
          id="text-input"
          type="text"
          placeholder="Type a command..."
          autocomplete="off"
          class="flex-1 px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <button
          type="submit"
          class="px-4 py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition"
        >
          Send
        </button>
        <button
          id="voice-btn"
          type="button"
          class="px-4 py-2 bg-green-500 text-white rounded-full hover:bg-green-600 transition"
        >
          🎤
        </button>
      </form>
    </footer>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
