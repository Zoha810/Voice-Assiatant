<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aoran Voice Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom animation for message fade-in */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-message {
      animation: fadeIn 0.3s ease-out;
    }
    /* Screen reader only class */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-gray-100 to-gray-200 flex items-center justify-center h-screen">
  <div class="flex flex-col w-full max-w-md h-5/6 bg-white rounded-xl shadow-lg overflow-hidden" aria-busy="false" id="app">
    <header class="bg-gradient-to-r from-indigo-700 to-purple-800 p-4 text-center">
      <h1 class="text-white text-2xl font-semibold">Aaron as Assistant</h1>
    </header>
    <main class="flex-1 p-4 bg-gray-50 overflow-y-auto space-y-4" role="log" aria-live="polite" id="chat-container">
      <div id="chat" class="flex flex-col space-y-3"></div>
    </main>
    <footer class="p-4 bg-gray-50 border-t border-gray-200">
      <form id="text-form" class="flex gap-2" role="form" aria-label="Send a command to Aoran">
        <input
          id="text-input"
          type="text"
          placeholder="Type a command..."
          autocomplete="off"
          class="flex-1 px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-teal-500"
          aria-label="Command input"
        />
        <button
          type="submit"
          id="send-btn"
          class="px-4 py-2 bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition transform hover:scale-105"
          aria-label="Send command"
        >
          Send
        </button>
        <button
          id="voice-btn"
          type="button"
          class="px-4 py-2 bg-teal-500 text-white rounded-full hover:bg-teal-600 transition transform hover:scale-105"
          aria-label="Start voice input"
        >
          🎤
        </button>
        <button
          id="stop-btn"
          type="button"
          class="px-4 py-2 bg-red-500 text-white rounded-full hover:bg-red-600 transition transform hover:scale-105 hidden"
          aria-label="Stop speaking"
        >
          🛑
        </button>
      </form>
    </footer>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
